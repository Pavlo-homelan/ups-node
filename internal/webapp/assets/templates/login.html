{{define "login.html"}}<!doctype html>
<html lang="{{.Language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Вхід · {{.NodeID}}</title>
  <script src="/assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <h1 id="login-title">{{.NodeID}}</h1>
      {{if .Error}}<p class="form-error" role="alert">{{.Error}}</p>{{end}}
      <form method="post" action="/login" class="login-form">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">
        <label>
          <span>Користувач</span>
          <input name="username" autocomplete="username" maxlength="128" required autofocus>
        </label>
        <label>
          <span>Пароль</span>
          <input type="password" name="password" autocomplete="current-password" maxlength="4096" required>
        </label>
        <button class="primary-button" type="submit">Увійти</button>
      </form>
      <p class="login-foot">Локальна PAM-автентифікація · захищена сесія</p>
    </section>
  </main>
</body>
</html>{{end}}
